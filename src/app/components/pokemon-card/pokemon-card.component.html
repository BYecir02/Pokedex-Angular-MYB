<a
  class="pokemon-card__link"
  [routerLink]="['/pokemon', pokemon().id]"
  [attr.aria-label]="'Voir le détail de ' + pokemon().name"
>
  <article class="pokemon-card">
    <img
      class="pokemon-card__image"
      [src]="pokemon().imageUrl"
      [alt]="'Image de ' + pokemon().name"
    />

    <p class="pokemon-card__number">N° {{ formatId(pokemon().id) }}</p>
    <h2 class="pokemon-card__name">{{ pokemon().name }}</h2>
  </article>
</a>
